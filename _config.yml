title: ITA4 - forår 27
description: Materiale til IT-arkitektur, Agil udvikling og Cloud
lang: da
baseurl: "/undervisningsmateriale"   # navnet på GitHub-repoet
url: "https://clbokea.github.io"
repository: clbokea/undervisningsmateriale
branch: main

# De tre fagområder. "id" skal matche mappenavnet.
courses:
  - id: it-arkitektur
    title: IT-arkitektur
    short: Arkitektur
    description: Design af robuste systemer – lag, mønstre, integration og kvalitetsattributter.
    icon: "◆"
    color: "#3b82f6"
  - id: agil-udvikling
    title: Agil udvikling
    short: Agil
    description: Scrum, Kanban og de værktøjer og vaner der får teams til at levere værdi.
    icon: "↻"
    color: "#10b981"
  - id: cloud
    title: Cloud
    short: Cloud
    description: Cloud-grundbegreber, containere, deployment og drift i skyen.
    icon: "☁"
    color: "#f59e0b"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Gør det muligt at skrive almindelige README.md-filer uden front matter
plugins:
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-seo-tag

readme_index:
  with_frontmatter: true

titles_from_headings:
  strip_title: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
