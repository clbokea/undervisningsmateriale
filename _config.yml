title: ITA4 - forår 27
description: Materiale til IT-arkitektur, Agil udvikling og Cloud
lang: da
baseurl: "/undervisningsmateriale"   # navnet på GitHub-repoet
url: "https://clbokea.github.io"
repository: clbokea/undervisningsmateriale
branch: main

# Tema: jekyll-gitbook – https://sighingnow.github.io/jekyll-gitbook/
remote_theme: sighingnow/jekyll-gitbook@a7d876936fe650c46eaf9eca92dc7afe0f1e1f17
theme: null   # slå GitHub Pages' standardtema (Primer) fra

# Fagene i menuen, i denne rækkefølge. "id" skal matche mappenavnet.
courses:
  - it-arkitektur
  - agil-udvikling
  - cloud

# Overskrifter fra den aktuelle side, der vises under siden i menuen
toc:
  enabled: true
  h_min: 2
  h_max: 3

# Søgningen skal også omfatte almindelige sider (ikke kun collections)
gitbook_search:
  include:
    pages: true
  exclude:
    files:
      - index.md
      - assets/search.html

syntax_highlighter_style: github
page_width: 800px

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Gør det muligt at skrive almindelige README.md-filer uden front matter
plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-seo-tag

readme_index:
  with_frontmatter: true

titles_from_headings:
  strip_title: true   # temaet viser selv sidens titel som overskrift

defaults:
  - scope:
      path: ""
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - compose.yaml
