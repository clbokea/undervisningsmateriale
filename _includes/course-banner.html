<section class="course-banner">
  <div class="container">
    <a href="{{ include.course.id | append: '/' | prepend: '/' | relative_url }}" class="course-banner-title">
      <span class="card-icon small">{{ include.course.icon }}</span> {{ include.course.title }}
    </a>
    <p>{{ include.course.description }}</p>
  </div>
</section>
