<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{{ '/' | relative_url }}">
      <span class="logo-mark">◢</span> {{ site.title }}
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Menu">☰</button>
    <nav id="main-nav" class="main-nav">
      {% for c in site.courses %}
        <a href="{{ c.id | append: '/' | prepend: '/' | relative_url }}"
           style="--accent: {{ c.color }}"
           {% if include.course and include.course.id == c.id %}class="active"{% endif %}>{{ c.title }}</a>
      {% endfor %}
      <a class="gh" href="https://github.com/{{ site.repository }}">GitHub</a>
    </nav>
  </div>
</header>
